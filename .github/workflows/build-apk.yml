name: Build Android APK

on:
  workflow_dispatch: # این خط به شما اجازه می‌دهد بیلد را دستی اجرا کنید

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      # مرحله جدید: تبدیل متن Base64 به فایل اصلی Keystore در یک مسیر موقت
      - name: Decode Keystore File
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/release.keystore

      # ساخت خروجی و امضای همزمان آن توسط خود هسته اندروید
      - name: Build and Sign APK (Release)
        run: |
          cd android
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=/tmp/release.keystore \
            -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

      # آپلود فایل نهایی امضاشده
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: hadi-factor2-apk
          path: android/app/build/outputs/apk/release/*.apk